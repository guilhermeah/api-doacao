# ── Banco de dados ───────────────────────────────────────────────────────────
# Em produção (Railway) as variáveis PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
# são injetadas automaticamente pelo plugin PostgreSQL do Railway.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:doacao}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Servidor ─────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Upload ───────────────────────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── PIX ──────────────────────────────────────────────────────────────────────
pix.key=${PIX_KEY:27287042878}
pix.merchant.name=${PIX_MERCHANT_NAME:Doe Mais}
pix.merchant.city=${PIX_MERCHANT_CITY:Americana}

# ── Gateway de pagamento ─────────────────────────────────────────────────────
# simulado → confirma automaticamente após N segundos (demo/desenvolvimento)
# asaas    → confirmação via webhook do PSP (produção com Asaas)
pix.gateway=${PIX_GATEWAY:simulado}
pix.simulacao.segundos=${PIX_SIMULACAO_SEGUNDOS:20}

# ── Gemini IA ────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
